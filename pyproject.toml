[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-load-classifier"
version = "0.2.0"
description = "House-grouped classification of timestamped electrical load recordings"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.8,<1.9",
    "joblib>=1.5,<2",
    "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["load_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
